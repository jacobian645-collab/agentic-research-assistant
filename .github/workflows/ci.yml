name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      # Full graph + real MCP servers (stdio) + deterministic fake LLM: no secrets, no cost.
      - run: pytest -q

  offline-eval:
    name: eval pipeline smoke (fake LLM)
    runs-on: ubuntu-latest
    needs: quality
    env:
      LLM_PROVIDER: fake
      EVAL_MIN_OVERALL: "2.5"   # plumbing gate only — quality gate runs in eval-bedrock.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: ara eval --concurrency 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-eval-report
          path: reports/

  docker:
    name: container build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agentic-research-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
